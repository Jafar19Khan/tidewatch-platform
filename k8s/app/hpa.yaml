# Adds pods when average CPU use goes above 50% of the requested CPU (100m per pod).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tidewatch
  namespace: tidewatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tidewatch
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 90
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
